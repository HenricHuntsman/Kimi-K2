[package]
name = "the-forge"
version = "1.0.0"
edition = "2021"
authors = ["THE FORGE Team"]
description = "High-performance components for THE FORGE"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "forge_core"
path = "src/lib.rs"

[[bin]]
name = "forge"
path = "src/main.rs"
